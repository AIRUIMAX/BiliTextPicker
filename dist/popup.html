<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 380px;
      max-height: 580px;
      overflow-y: auto;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      position: relative;
      text-align: center;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
      color: #00a1d6;
    }

    /* ===== 工具箱（右上角） ===== */
    .toolbox-btn {
      position: absolute;
      top: -5px;
      right: -5px;
      flex: none;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 6px;
      background: none;
      color: #7c8b99;
      font-size: 17px;
      line-height: 1;
    }
    .toolbox-btn:hover {
      background: #eef3f7;
      color: #00a1d6;
    }
    .toolbox-btn.active {
      background: #e9f6fc;
      color: #00a1d6;
    }
    .toolbox-panel {
      position: absolute;
      top: 26px;
      right: -5px;
      z-index: 20;
      width: 258px;
      padding: 6px 10px 4px;
      border: 1px solid #e3e9ef;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(11, 95, 133, 0.16);
      text-align: left;
    }
    .toolbox-head {
      padding-bottom: 5px;
      border-bottom: 1px solid #f2f6fa;
      font-size: 12px;
      font-weight: 600;
      color: #5a6b7b;
    }
    .toolbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      cursor: pointer;
    }
    .toolbox-item + .toolbox-item {
      border-top: 1px solid #f2f6fa;
    }
    .toolbox-text {
      flex: 1;
      min-width: 0;
    }
    .toolbox-text b {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #0b5f85;
    }
    .toolbox-desc {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      line-height: 1.35;
      color: #8695a3;
    }
    /* 开关 */
    .switch {
      position: relative;
      flex: none;
      display: inline-block;
      width: 34px;
      height: 18px;
    }
    .switch input {
      position: absolute;
      width: 0;
      height: 0;
      margin: 0;
      opacity: 0;
    }
    .switch-knob {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: #cfd8dc;
      border-radius: 9px;
      transition: background 0.2s;
    }
    .switch-knob::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .switch input:checked + .switch-knob {
      background: #00a1d6;
    }
    .switch input:checked + .switch-knob::before {
      transform: translateX(16px);
    }
    /* 工具箱里的「动作型」区块（不是开关，是按钮） */
    .toolbox-block {
      padding: 8px 0 4px;
      border-top: 1px solid #f2f6fa;
    }
    .toolbox-block-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .toolbox-block-head b {
      flex: none;
      font-size: 13px;
      font-weight: 600;
      color: #0b5f85;
    }
    .toolbox-block-head .toolbox-desc {
      margin-top: 0;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toolbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .toolbox-row select,
    .toolbox-row input[type="number"] {
      flex: 1;
      min-width: 0;
      padding: 5px 6px;
      border: 1px solid #dbe3ea;
      border-radius: 4px;
      background: #fff;
      font-size: 12px;
      color: #333;
    }
    .mini-btn {
      flex: none;
      width: auto;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
    }
    .mini-btn.stop {
      background: #f56c6c;
    }
    .mini-btn.stop:hover {
      background: #d94f4f;
    }
    /* 取值方式并排按钮（自定义 / 全部加载） */
    .mode-btn {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid #dbe3ea;
      border-radius: 4px;
      background: #fff;
      color: #4a5b6b;
      font-size: 12px;
    }
    .mode-btn:hover {
      background: #f4f9fd;
      color: #00a1d6;
      border-color: #a8dcf0;
    }
    .mode-btn.active {
      background: #e9f6fc;
      border-color: #7fcbe8;
      color: #0b5f85;
      font-weight: 600;
    }
    /* 用「自定义/全部」时，下拉框不是当前取值来源，压暗提示一下 */
    .toolbox-row select.muted {
      opacity: 0.55;
    }
    .status {
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .status.connected {
      background: #e8f5e8;
      color: #2e7d32;
    }
    .status.error {
      background: #ffebee;
      color: #c62828;
    }
    .controls {
      display: flex;
      flex-direction: row;
      gap: 8px;
      margin-bottom: 12px;
    }
    .language-select {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .language-select label {
      color: #666;
      white-space: nowrap;
    }
    .language-select select {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      font-size: 13px;
      color: #333;
    }
    .language-select select:disabled {
      background: #f5f5f5;
      color: #999;
    }
    button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background: #00a1d6;
      color: white;
      cursor: pointer;
      font-size: 13px;
      flex: 1;
    }
    button:hover {
      background: #0088b3;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .info {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
      line-height: 1.4;
    }
    /* 字幕内容区域样式 */
    .subtitle-container {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 6px;
      margin-top: 12px;
      background: #f9f9f9;
    }
    .subtitle-content {
      padding: 12px;
    }
    .subtitle-item {
      margin-bottom: 8px;
      padding: 8px;
      background: #fff;
      border-radius: 4px;
      border-left: 3px solid #00a1d6;
      font-size: 13px;
      color: #333;
      display: flex;
      align-items: center;
    }
    .subtitle-time {
      font-size: 11px;
      color: #666;
      margin-right: 8px;
    }
    .empty-state {
      text-align: center;
      padding: 20px;
      color: #999;
      font-size: 13px;
    }

    /* ===== 合集批量下载 ===== */
    .collection {
      border: 1px solid #e3e9ef;
      border-radius: 8px;
      background: #fcfdff;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .collection-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      background: #f1f8fd;
      border-bottom: 1px solid #e3e9ef;
      cursor: pointer;
    }
    .collection-head .head-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .collection-head .pod-icon {
      flex: none;
      font-size: 11px;
      color: #fff;
      background: #00a1d6;
      border-radius: 3px;
      padding: 1px 5px;
    }
    .collection-head .pod-name {
      font-size: 13px;
      font-weight: 600;
      color: #0b5f85;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .collection-head .pod-amt {
      font-size: 11px;
      color: #7b8a99;
      white-space: nowrap;
    }
    .link-btn {
      flex: none;
      width: auto;
      padding: 2px 6px;
      background: none;
      color: #00a1d6;
      font-size: 12px;
      white-space: nowrap;
    }
    .link-btn:hover {
      background: none;
      text-decoration: underline;
    }
    .collection-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      font-size: 12px;
      color: #5a6b7b;
      border-bottom: 1px solid #eef3f7;
    }
    .collection-toolbar label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .collection-toolbar input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
    }
    .collection-list {
      max-height: 190px;
      overflow-y: auto;
    }
    .ci {
      border-bottom: 1px solid #f2f6fa;
    }
    .ci-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      font-size: 12px;
      color: #333;
      cursor: pointer;
      user-select: none;
    }
    .ci-row:hover {
      background: #f7fbfe;
    }
    .ci-row input[type="checkbox"] {
      margin: 0;
      flex: none;
      cursor: pointer;
    }
    .ci-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ci-badge {
      flex: none;
      font-size: 11px;
      color: #00a1d6;
      background: #e9f6fc;
      border-radius: 3px;
      padding: 1px 5px;
    }
    .ci-cur {
      flex: none;
      font-size: 11px;
      color: #f56c6c;
    }
    .ci-expand {
      flex: none;
      width: auto;
      padding: 0 4px;
      background: none;
      color: #99a7b4;
      font-size: 12px;
    }
    .ci-expand:hover {
      background: none;
      color: #00a1d6;
    }
    .ci-pages {
      display: none;
      background: #fafcfe;
    }
    .ci-pages.open {
      display: block;
    }
    .ci-page {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px 5px 26px;
      font-size: 12px;
      color: #556;
      cursor: pointer;
      user-select: none;
    }
    .ci-page:hover {
      background: #f3f9fd;
    }
    .ci-page input[type="checkbox"] {
      margin: 0;
      flex: none;
      cursor: pointer;
    }
    .ci-page .page-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ci-page .page-dur {
      flex: none;
      color: #9aa8b5;
      font-size: 11px;
    }
    .collection-footer {
      padding: 8px 10px;
      border-top: 1px solid #eef3f7;
    }
    .export-mode {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #5a6b7b;
    }
    .export-mode label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .export-mode input[type="radio"],
    .export-mode input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
    }
    .collection-footer button {
      width: 100%;
    }
    .collection-hint {
      margin-bottom: 6px;
      font-size: 11px;
      line-height: 1.4;
      color: #9aa8b5;
    }
    .collection-progress {
      margin-top: 6px;
      min-height: 15px;
      font-size: 12px;
      color: #0b5f85;
    }
    .collection-progress.error {
      color: #c62828;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>B站字幕获取器</h1>
    <button id="toolboxBtn" class="toolbox-btn" type="button" title="工具箱">⚙</button>

    <!-- 工具箱：扩展附加功能的开关（默认都开启） -->
    <div id="toolboxPanel" class="toolbox-panel" style="display: none;">
      <div class="toolbox-head">工具箱</div>
      <label class="toolbox-item">
        <span class="toolbox-text">
          <b>音量增强</b>
          <span class="toolbox-desc" id="volumeBoostDesc">在播放器区域滚轮 / ↑↓ 调音量，最高 500%</span>
        </span>
        <span class="switch"><input type="checkbox" id="volumeBoostToggle"><span class="switch-knob"></span></span>
      </label>
      <label class="toolbox-item">
        <span class="toolbox-text">
          <b>控制栏亮白</b>
          <span class="toolbox-desc" id="controlBarDesc">播放器控制栏文字与图标改为亮白色</span>
        </span>
        <span class="switch"><input type="checkbox" id="controlBarToggle"><span class="switch-knob"></span></span>
      </label>

      <!-- 评论区：一次加载到指定条数，省得手动往下滚 -->
      <div class="toolbox-block">
        <div class="toolbox-block-head">
          <b>评论加载</b>
          <span class="toolbox-desc" id="commentTotalHint">读取评论数…</span>
        </div>
        <div class="toolbox-row">
          <select id="commentTarget">
            <option value="100">加载 100 条</option>
            <option value="200" selected>加载 200 条</option>
            <option value="500">加载 500 条</option>
            <option value="1000">加载 1000 条</option>
          </select>
          <button id="commentLoadBtn" class="mini-btn" type="button">开始</button>
        </div>
        <div class="toolbox-row">
          <button id="commentCustomBtn" class="mode-btn" type="button">自定义</button>
          <button id="commentAllBtn" class="mode-btn" type="button">全部加载</button>
        </div>
        <div class="toolbox-row" id="commentCustomRow" style="display: none;">
          <input type="number" id="commentCustomTarget" min="1" max="2000" step="50" placeholder="输入条数（1~2000）">
        </div>
        <div class="toolbox-desc" id="commentStatus">自动加载评论，不用手动滚；加载中可在页面右下角停止</div>
      </div>
    </div>
  </div>

  <div id="status" class="status">
    正在检测B站视频页面...
  </div>
  
  <div class="controls">
    <button id="refreshSubtitles" disabled>刷新字幕</button>
    <button id="copySubtitles" disabled>复制字幕</button>
    <button id="downloadSubtitles" disabled>下载字幕</button>
  </div>

  <div class="language-select">
    <label for="subtitleLanguage">字幕语言：</label>
    <select id="subtitleLanguage" disabled>
      <option value="-1">正在加载语言列表...</option>
    </select>
  </div>

  <!-- 合集批量下载（默认折叠，点「展开」才显示列表） -->
  <div id="collectionSection" class="collection" style="display: none;">
    <div class="collection-head">
      <div class="head-left">
        <span class="pod-icon">合集</span>
        <span class="pod-name" id="collectionName">合集</span>
        <span class="pod-amt" id="collectionAmt"></span>
      </div>
      <button class="link-btn" id="collectionToggleList" type="button">展开 ▾</button>
    </div>
    <div id="collectionBody" style="display: none;">
      <div class="collection-toolbar" id="collectionToolbar">
        <label><input type="checkbox" id="collectionSelectAll"> 全选</label>
        <span id="collectionCount">已选 0 集</span>
        <span id="collectionView"></span>
      </div>
      <div class="collection-list" id="collectionList"></div>
      <div class="collection-footer">
        <div class="export-mode">
          <label><input type="radio" name="exportMode" id="exportFiles" value="files" checked> 单独 TXT</label>
          <label><input type="radio" name="exportMode" id="exportZip" value="zip"> 打包为 ZIP</label>
          <label><input type="radio" name="exportMode" id="exportSingle" value="single"> 合并 TXT</label>
        </div>
        <div class="export-mode" id="saveLayoutRow">
          <label title="勾选后收进一个以合集名命名的文件夹"><input type="checkbox" id="layoutUnified"> 统一存放</label>
        </div>
        <div class="collection-hint">抓取期间请保持面板打开，完成后自动保存到下载目录</div>
        <button id="downloadCollectionBtn" disabled>下载选中字幕</button>
        <div class="collection-progress" id="collectionProgress"></div>
      </div>
    </div>
  </div>
  
  <!-- 字幕内容区域 -->
  <div class="subtitle-container">
    <div id="subtitleContent" class="subtitle-content">
      <div class="empty-state">请在B站视频页面使用此扩展</div>
    </div>
  </div>
  
  <div class="info" id="videoInfo" style="padding-top: 5px;">
    正在获取视频信息...
  </div>
  
  <div class="info" id="episodeInfo" style="padding-top: 5px; display: none;">
  </div>


  <script src="popup.js"></script>
</body>
</html>
